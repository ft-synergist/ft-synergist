name: SEO Audit

on:
  schedule:
    # Runs every Monday at 9:00 AM Singapore time (01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run SEO audit agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/seo-agent.mjs > audit-output.txt

      - name: Upload audit report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_number }}
          path: audit-output.txt
          retention-days: 90

      - name: Run GSC position report
        env:
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: node scripts/gsc-report.mjs > gsc-report.txt

      - name: Upload GSC report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsc-report-${{ github.run_number }}
          path: gsc-report.txt
          retention-days: 90

      - name: Run GA4 Weekly Lead & Conversion Report
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
        run: node scripts/ga4-report.mjs > ga4-report.txt
        continue-on-error: true

      - name: Upload GA4 report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga4-report-${{ github.run_number }}
          path: ga4-report.txt
          retention-days: 90

      - name: Run Core Web Vitals & PageSpeed Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/cwv-report.mjs > cwv-report.txt
        continue-on-error: true

      - name: Upload Core Web Vitals report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwv-report-${{ github.run_number }}
          path: cwv-report.txt
          retention-days: 90

      - name: Run GEO & Generative AI Search Citation Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/geo-agent.mjs > geo-report.txt
        continue-on-error: true

      - name: Upload GEO citation report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: geo-report-${{ github.run_number }}
          path: geo-report.txt
          retention-days: 90